# Deduped IPs from risk instances → censysasmhosts. outputlookup replaces asm_risk_instances_domain_lookup each run (no append). Throttle constants: censys_asm_hosts_command.py.
[Generate Risk Instance Domain Lookup]
disabled = 1
enableSched = 0
cron_schedule = 0 * * * *
search = | censysasmriskinstances | spath | rename context.ip as ip | dedup ip | censysasmhosts | table ip, domain | fillnull value="" domain | outputlookup asm_risk_instances_domain_lookup

# Indexed logbook events → dedup IP → censysasmhosts (head 100 for testing). Replaces asm_logbook_ip_to_domain_lookup each run.
[Generate Logbook IP Domain Lookup]
disabled = 1
enableSched = 0
cron_schedule = 0 * * * *
search = index=* sourcetype="censys:asm:logbook" ip=* | dedup ip | head 100 | censysasmhosts | table ip, domain | fillnull value="" domain | outputlookup asm_logbook_ip_to_domain_lookup
