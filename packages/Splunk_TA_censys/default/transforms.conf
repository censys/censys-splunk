# IP → domain for risk instances. Populated by "Generate Risk Instance Domain Lookup" (or Map IP to Domain).
[asm_risk_instances_domain_lookup]
external_type = kvstore
collection = asm_risk_instances_domain
fields_list = ip, domain

# IP → domain for ASM logbook (indexed sourcetype censys:asm:logbook). Populated by "Generate Logbook IP Domain Lookup".
[asm_logbook_domain_lookup]
external_type = kvstore
collection = asm_logbook_ip_to_domain
fields_list = ip, domain
